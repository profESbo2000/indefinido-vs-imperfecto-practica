<!DOCTYPE html>
<html lang="es">
<head>
    <script>
  (function pedirClave() {
    // 🔑 Escribe aquí la contraseña para tus alumnos:
    const CLAVE_CORRECTA = "ELE2026"; 

    // Comprueba si ya ingresó la clave en esta sesión del navegador
    if (sessionStorage.getItem("acceso_autorizado") !== "true") {
      let intento = prompt("🔒 ACTIVIDAD PROTEGIDA\nIngresa la contraseña proporcionada por tu profesor:");

      if (intento === CLAVE_CORRECTA) {
        sessionStorage.setItem("acceso_autorizado", "true");
      } else {
        alert("❌ Contraseña incorrecta. Contacta a tu profesor.");
        document.write(`
          <div style="font-family: sans-serif; text-align: center; padding: 50px;">
            <h2>Acceso Restringido 🔒</h2>
            <p>Esta actividad es exclusiva para estudiantes registrados.</p>
            <button onclick="location.reload()">Intentar de nuevo</button>
          </div>
        `);
        window.stop(); // Cancela la carga del resto de la página
      }
    }
  })();
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizlet - Pretérito vs. Imperfecto</title>
    <style>
        :root {
            --bg-dark: #0a092d;
            --card-dark: #2e3856;
            --card-hover: #3b476d;
            --primary: #4255ff;
            --primary-hover: #2e3ed4;
            --accent: #ffcd1f;
            --text-white: #ffffff;
            --text-muted: #939bb4;
            --border-dark: #3e4968;
            --success: #18ae79;
            --error: #ff7873;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-white);
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--text-white);
            font-size: 2.2rem;
            margin-bottom: 6px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Navegación */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: var(--card-dark);
            border: 2px solid var(--border-dark);
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            border-color: var(--primary);
            color: var(--text-white);
            background: var(--card-hover);
        }

        .tab-btn.active {
            background: var(--primary);
            border-color: var(--primary);
        }

        /* MODO SECCIONES */
        .mode-section {
            display: none;
        }

        .mode-section.active {
            display: block;
        }

        /* MODO 1: FLASHCARDS */
        .flashcard-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card-container {
            width: 100%;
            max-width: 600px;
            height: 380px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 16px;
            box-shadow: var(--shadow);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            background: var(--card-dark);
            border: 2px solid var(--border-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
        }

        .card-back {
            transform: rotateY(180deg);
            background: #232a40;
        }

        .card-term {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-white);
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .card-answer {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .audio-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-top: 10px;
            font-size: 1.2rem;
            color: var(--text-white);
            transition: transform 0.2s, background 0.2s;
        }

        .audio-btn:hover {
            transform: scale(1.1);
            background: var(--primary);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 25px;
        }

        .ctrl-btn {
            background: var(--card-dark);
            border: 2px solid var(--border-dark);
            color: var(--text-white);
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .ctrl-btn:hover {
            background: var(--card-hover);
            border-color: var(--primary);
        }

        /* MODO 2: QUIZ / TEST DE APRENDIZAJE */
        .quiz-card {
            background: var(--card-dark);
            border-radius: 16px;
            padding: 35px;
            box-shadow: var(--shadow);
            border: 2px solid var(--border-dark);
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-dark);
            padding-bottom: 15px;
        }

        .quiz-body {
            text-align: center;
        }

        .quiz-question {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 30px;
            color: var(--text-white);
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
        }

        .opt-btn {
            padding: 18px;
            border: 2px solid var(--border-dark);
            background: var(--bg-dark);
            color: var(--text-white);
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .opt-btn:hover {
            border-color: var(--primary);
            background: var(--card-hover);
        }

        .opt-btn.correct {
            background: var(--success) !important;
            color: white !important;
            border-color: var(--success) !important;
        }

        .opt-btn.incorrect {
            background: var(--error) !important;
            color: white !important;
            border-color: var(--error) !important;
        }

        .next-quiz-btn {
            margin-top: 25px;
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            display: none;
        }

        /* MODO 3: MATCH GAME */
        .match-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
        }

        .match-tile {
            background: var(--card-dark);
            border: 2px solid var(--border-dark);
            padding: 15px 10px;
            border-radius: 12px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .match-tile:hover {
            border-color: var(--primary);
            background: var(--card-hover);
        }

        .match-tile.selected {
            border-color: var(--accent);
            background: var(--card-hover);
        }

        .match-tile.matched {
            visibility: hidden;
            opacity: 0;
        }

        /* MODO 4: LISTA COMPLETA */
        .search-bar {
            width: 100%;
            padding: 14px 18px;
            background: var(--card-dark);
            border: 2px solid var(--border-dark);
            border-radius: 10px;
            font-size: 1rem;
            color: var(--text-white);
            margin-bottom: 20px;
            outline: none;
        }

        .search-bar:focus {
            border-color: var(--primary);
        }

        .vocab-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .vocab-item {
            background: var(--card-dark);
            border: 1px solid var(--border-dark);
            border-radius: 10px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .vocab-es {
            font-weight: 700;
            font-size: 1.1rem;
            flex: 1;
            color: var(--text-white);
        }

        .vocab-ans {
            color: var(--accent);
            font-weight: 700;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Pretérito vs. Imperfecto</h1>
        <p>Práctica de oraciones y reglas gramaticales</p>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchMode('cards')">🎴 Fichas</button>
        <button class="tab-btn" onclick="switchMode('quiz')">✍️ Aprender / Test</button>
        <button class="tab-btn" onclick="switchMode('match')">🧩 Combinar</button>
        <button class="tab-btn" onclick="switchMode('list')">📋 Lista Completa (29)</button>
    </div>

    <!-- MODO 1: FLASHCARDS -->
    <div id="cards-mode" class="mode-section active">
        <div class="flashcard-wrapper">
            <div class="card-container" onclick="flipCard()">
                <div class="card" id="flashcard">
                    <div class="card-face card-front">
                        <div class="card-term" id="card-prompt">Yo (ir)_____ a la escuela a las 7:30.</div>
                        <button class="audio-btn" onclick="speakText(event, 'prompt')">🔊</button>
                    </div>
                    <div class="card-face card-back">
                        <div class="card-answer" id="card-ans">fui</div>
                        <button class="audio-btn" onclick="speakText(event, 'ans')">🔊</button>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button class="ctrl-btn" onclick="prevCard()">⬅️ Anterior</button>
                <span id="card-counter" style="font-weight: bold; color: var(--text-muted);">1 / 29</span>
                <button class="ctrl-btn" onclick="nextCard()">Siguiente ➡️</button>
            </div>
        </div>
    </div>

    <!-- MODO 2: QUIZ -->
    <div id="quiz-mode" class="mode-section">
        <div class="quiz-card">
            <div class="quiz-header">
                <span>Pregunta <span id="q-num">1</span> / 29</span>
                <span>Puntos: <span id="q-score">0</span></span>
            </div>
            <div class="quiz-body">
                <div class="quiz-question" id="quiz-question">Yo (ir)_____ a la escuela a las 7:30.</div>
                <div class="options-grid" id="options-grid"></div>
                <button class="next-quiz-btn" id="next-quiz-btn" onclick="nextQuizQuestion()">Siguiente Pregunta ➔</button>
            </div>
        </div>
    </div>

    <!-- MODO 3: MATCH GAME -->
    <div id="match-mode" class="mode-section">
        <div style="text-align: center; margin-bottom: 20px; font-weight: bold; color: var(--text-muted); font-size: 1.2rem;">
            Tiempo: <span id="match-timer" style="color: var(--accent);">0.0</span>s
        </div>
        <div class="match-grid" id="match-grid"></div>
    </div>

    <!-- MODO 4: LISTA COMPLETA -->
    <div id="list-mode" class="mode-section">
        <input type="text" class="search-bar" id="search-bar" placeholder="Buscar oración o regla gramatical..." oninput="filterList()">
        <div class="vocab-list" id="vocab-list"></div>
    </div>
</div>

<script>
    const itemsData = [
        // Oraciones
        { prompt: "Yo (ir)_____ a la escuela a las 7:30.", ans: "fui" },
        { prompt: "Mi familia y yo (visitar) _______museos los domingos.", ans: "visitábamos" },
        { prompt: "Yo (comer) ____________ una hamburguesa para el almuerzo.", ans: "comí" },
        { prompt: "Cuando nosotros (ser) ____ jóvenes, (jugar) ____ con muchos juguetes.", ans: "éramos, jugábamos" },
        { prompt: "Anoche, la tortuga (caminar) _______ muy lentamente.", ans: "caminó" },
        { prompt: "Mi tía (leer) _____ siempre el New York Times.", ans: "leía" },
        { prompt: "Yo (tener) ___________ muchos amigos.", ans: "tenía" },
        { prompt: "Mis primos (esquiar) _____ en los inviernos.", ans: "esquiaban" },
        { prompt: "Tú (estudiar) ____mucho para el examen de química.", ans: "estudiaste" },
        { prompt: "Mi abuela y yo (ver) ______un programa los sábados por la noche.", ans: "veíamos" },
        { prompt: "Mi mamá (vivir) ___________ en Bilbao.", ans: "vivía" },
        { prompt: "Ellos (terminar) _____________ la tarea a la una.", ans: "terminaron" },
        { prompt: "De pequeño (acostarse) _______________ a las nueve.", ans: "me acostaba" },
        { prompt: "Ayer me caí mientras (caminar) __________________", ans: "caminaba" },
        { prompt: "Yo le (dar) _________ una tarjeta a mi madre para el Día de las Madres.", ans: "di" },
        { prompt: "Ayer yo (acostarse) ______ a las 11 de la noche.", ans: "me acosté" },
        { prompt: "El año pasado ellos (ir) _____ a Costa Rica.", ans: "fueron" },
        { prompt: "Los jóvenes siempre (ir) ______ al parque después de la escuela.", ans: "iban" },
        
        // Reglas
        { prompt: "acciones habituales", ans: "imperfecto" },
        { prompt: "descripciones", ans: "imperfecto" },
        { prompt: "el tiempo (clima)", ans: "imperfecto" },
        { prompt: "la hora", ans: "imperfecto" },
        { prompt: "la edad (age)", ans: "imperfecto" },
        { prompt: "estado mental, físico o emocional", ans: "imperfecto" },
        { prompt: "una acción en progreso", ans: "imperfecto" },
        { prompt: "Una acción completa", ans: "pretérito" },
        { prompt: "el comienzo o el fin de una acción", ans: "pretérito" },
        { prompt: "serie o lista de acciones completas", ans: "pretérito" },
        { prompt: "una acción que interrumpe otra acción", ans: "pretérito" }
    ];

    /* --- CAMBIO DE MODOS --- */
    function switchMode(mode) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.mode-section').forEach(sec => sec.classList.remove('active'));

        event.target.classList.add('active');
        document.getElementById(`${mode}-mode`).classList.add('active');

        if (mode === 'quiz') startQuiz();
        if (mode === 'match') startMatchGame();
        if (mode === 'list') renderList();
    }

    /* --- MODO 1: FLASHCARDS --- */
    let currentCardIndex = 0;
    let isFlipped = false;

    function renderCard() {
        const item = itemsData[currentCardIndex];
        document.getElementById('card-prompt').textContent = item.prompt;
        document.getElementById('card-ans').textContent = item.ans;
        document.getElementById('card-counter').textContent = `${currentCardIndex + 1} / ${itemsData.length}`;
        isFlipped = false;
        document.getElementById('flashcard').classList.remove('flipped');
    }

    function flipCard() {
        isFlipped = !isFlipped;
        document.getElementById('flashcard').classList.toggle('flipped', isFlipped);
    }

    function nextCard() {
        currentCardIndex = (currentCardIndex + 1) % itemsData.length;
        renderCard();
    }

    function prevCard() {
        currentCardIndex = (currentCardIndex - 1 + itemsData.length) % itemsData.length;
        renderCard();
    }

    function speakText(event, type) {
        event.stopPropagation();
        const text = type === 'prompt' ? itemsData[currentCardIndex].prompt : itemsData[currentCardIndex].ans;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'es-ES';
        window.speechSynthesis.speak(utterance);
    }

    /* --- MODO 2: QUIZ / TEST --- */
    let quizIndex = 0;
    let quizScore = 0;

    function startQuiz() {
        quizIndex = 0;
        quizScore = 0;
        document.getElementById('q-score').textContent = '0';
        renderQuizQuestion();
    }

    function renderQuizQuestion() {
        const item = itemsData[quizIndex];
        document.getElementById('q-num').textContent = quizIndex + 1;
        document.getElementById('quiz-question').textContent = item.prompt;
        document.getElementById('next-quiz-btn').style.display = 'none';

        const optionsGrid = document.getElementById('options-grid');
        optionsGrid.innerHTML = '';

        let options = [item.ans];
        
        // Si es una regla de gramática (respuesta es imperfecto o pretérito)
        if (item.ans === "imperfecto" || item.ans === "pretérito") {
            options = ["imperfecto", "pretérito"];
        } else {
            // Generar distractores con respuestas de los otros ítems
            while (options.length < 4) {
                let randomOpt = itemsData[Math.floor(Math.random() * itemsData.length)].ans;
                if (!options.includes(randomOpt) && randomOpt !== "imperfecto" && randomOpt !== "pretérito") {
                    options.push(randomOpt);
                }
            }
            options.sort(() => Math.random() - 0.5);
        }

        options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerHTML = `<span style="color: var(--text-muted); width: 20px;">${idx + 1}</span> <span>${opt}</span>`;
            btn.onclick = () => checkQuiz(btn, opt, item.ans);
            optionsGrid.appendChild(btn);
        });
    }

    function checkQuiz(btn, selected, correct) {
        document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
        if (selected === correct) {
            btn.classList.add('correct');
            quizScore++;
            document.getElementById('q-score').textContent = quizScore;
        } else {
            btn.classList.add('incorrect');
            document.querySelectorAll('.opt-btn').forEach(b => {
                if (b.innerText.includes(correct)) b.classList.add('correct');
            });
        }
        document.getElementById('next-quiz-btn').style.display = 'block';
    }

    function nextQuizQuestion() {
        quizIndex++;
        if (quizIndex < itemsData.length) {
            renderQuizQuestion();
        } else {
            alert(`¡Práctica completada! Resultado: ${quizScore} / ${itemsData.length}`);
            startQuiz();
        }
    }

    /* --- MODO 3: MATCH GAME --- */
    let selectedTile = null;
    let matchTimer = 0;
    let timerInterval = null;

    function startMatchGame() {
        clearInterval(timerInterval);
        matchTimer = 0;
        document.getElementById('match-timer').textContent = '0.0';
        
        timerInterval = setInterval(() => {
            matchTimer += 0.1;
            document.getElementById('match-timer').textContent = matchTimer.toFixed(1);
        }, 100);

        const subset = [...itemsData].sort(() => Math.random() - 0.5).slice(0, 6);
        let items = [];

        subset.forEach((item, id) => {
            items.push({ id, text: item.prompt });
            items.push({ id, text: item.ans });
        });

        items.sort(() => Math.random() - 0.5);

        const grid = document.getElementById('match-grid');
        grid.innerHTML = '';

        items.forEach(item => {
            const tile = document.createElement('div');
            tile.className = 'match-tile';
            tile.dataset.id = item.id;
            tile.textContent = item.text;
            tile.onclick = () => handleTileClick(tile);
            grid.appendChild(tile);
        });
    }

    function handleTileClick(tile) {
        if (tile.classList.contains('matched')) return;

        if (!selectedTile) {
            selectedTile = tile;
            tile.classList.add('selected');
        } else if (selectedTile === tile) {
            selectedTile.classList.remove('selected');
            selectedTile = null;
        } else {
            if (selectedTile.dataset.id === tile.dataset.id) {
                selectedTile.classList.add('matched');
                tile.classList.add('matched');
                selectedTile = null;

                if (document.querySelectorAll('.match-tile:not(.matched)').length === 0) {
                    clearInterval(timerInterval);
                    setTimeout(() => alert(`¡Completado! Tiempo total: ${matchTimer.toFixed(1)} segundos`), 200);
                }
            } else {
                tile.classList.add('selected');
                setTimeout(() => {
                    selectedTile.classList.remove('selected');
                    tile.classList.remove('selected');
                    selectedTile = null;
                }, 400);
            }
        }
    }

    /* --- MODO 4: LISTA COMPLETA --- */
    function renderList() {
        const container = document.getElementById('vocab-list');
        container.innerHTML = '';
        itemsData.forEach(v => {
            const item = document.createElement('div');
            item.className = 'vocab-item';
            item.innerHTML = `
                <span class="vocab-es">${v.prompt}</span>
                <span class="vocab-ans">${v.ans}</span>
            `;
            container.appendChild(item);
        });
    }

    function filterList() {
        const query = document.getElementById('search-bar').value.toLowerCase();
        document.querySelectorAll('.vocab-item').forEach(item => {
            const promptText = item.querySelector('.vocab-es').textContent.toLowerCase();
            const ansText = item.querySelector('.vocab-ans').textContent.toLowerCase();
            item.style.display = (promptText.includes(query) || ansText.includes(query)) ? 'flex' : 'none';
        });
    }

    // Inicialización
    renderCard();
</script>

</body>
</html>
